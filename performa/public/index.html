<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Performa — personal organizer</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">🗂️</span>
      <span class="brand-name">Performa</span>
    </div>
    <nav class="tabs">
      <button class="tab-button active" data-tab="today" type="button">Today</button>
      <button class="tab-button" data-tab="tasks" type="button">Tasks</button>
      <button class="tab-button" data-tab="notes" type="button">Notes</button>
    </nav>
  </header>

  <main>
    <section id="status-banner" class="status" hidden></section>

    <!-- Today -->
    <section id="tab-today" class="tab-panel">
      <div class="panel">
        <h2>Quick add</h2>
        <form id="quick-add-form" class="task-form">
          <input id="quick-title" type="text" placeholder="What needs doing?" required maxlength="200" />
          <input id="quick-due" type="date" />
          <select id="quick-priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
          <button type="submit">Add</button>
        </form>
      </div>

      <div class="panel">
        <h2>Due today &amp; overdue</h2>
        <div id="today-list" class="task-list"></div>
      </div>
    </section>

    <!-- Tasks -->
    <section id="tab-tasks" class="tab-panel" hidden>
      <div class="panel">
        <h2>All tasks</h2>
        <div class="filter-row">
          <button class="filter-button active" data-filter="all" type="button">All</button>
          <button class="filter-button" data-filter="active" type="button">Active</button>
          <button class="filter-button" data-filter="completed" type="button">Completed</button>
        </div>
        <div id="tasks-list" class="task-list"></div>
      </div>
    </section>

    <!-- Notes -->
    <section id="tab-notes" class="tab-panel" hidden>
      <div class="panel">
        <div class="notes-toolbar">
          <input id="notes-search" type="search" placeholder="Search notes…" />
          <button id="new-note" type="button">➕ New note</button>
        </div>
        <div id="notes-list" class="notes-grid"></div>
      </div>
    </section>
  </main>

  <!-- Note editor modal -->
  <div id="note-modal" class="modal" hidden>
    <div class="modal-card">
      <h3 id="note-modal-title">New note</h3>
      <input id="note-title-input" type="text" placeholder="Title" maxlength="200" />
      <textarea id="note-body-input" placeholder="Write something…" rows="8"></textarea>
      <div class="modal-actions">
        <button id="note-cancel" type="button" class="secondary">Cancel</button>
        <button id="note-save" type="button">Save</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
